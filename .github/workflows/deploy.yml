name: Deploy

# Builds the site from main, keeps out/ as the `site` artifact, and publishes
# out/ to the `deploy` branch, which Hostinger's website Git feature (and any
# host that pulls files without building) serves as-is. The deploy branch is
# generated: never edit it by hand. See docs/architecture/deployment.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time, in order; a queued run waits rather than cancelling the
# one that is pushing.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:site
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          # out/.htaccess and out/_next/static/.htaccess are dotfiles.
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish out/ to the deploy branch
        # A manual run from another branch builds and uploads, but only main publishes.
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_BRANCH: deploy
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/deploy-branch"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch lives in a worktree, which shares the checkout's credentials.
          if git ls-remote --exit-code --heads origin "$DEPLOY_BRANCH" > /dev/null; then
            # Stack a normal commit on the current tip.
            git fetch --no-tags --depth=1 origin "+refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
            git worktree add -B "$DEPLOY_BRANCH" "$site" "origin/$DEPLOY_BRANCH"
          else
            # First deploy: an orphan branch that shares no history with main.
            git worktree add --detach "$site"
            git -C "$site" checkout --orphan "$DEPLOY_BRANCH"
            # Empty the index too, so main's .gitattributes cannot apply to out/.
            git -C "$site" rm -r -q -f .
          fi

          # Make the tree exactly out/, dotfiles included; .git is the worktree link.
          find "$site" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. "$site"/
          git -C "$site" add --all

          if git -C "$site" diff --cached --quiet; then
            echo "out/ matches $DEPLOY_BRANCH; nothing to publish."
            exit 0
          fi
          git -C "$site" commit --quiet -m "Deploy $SOURCE_SHA from main"
          # A plain push: if the branch moved, this fails rather than overwriting it.
          git -C "$site" push origin "HEAD:refs/heads/$DEPLOY_BRANCH"
          echo "Published $SOURCE_SHA to $DEPLOY_BRANCH."

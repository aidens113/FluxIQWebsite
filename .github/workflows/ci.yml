name: CI

on:
  push:
    # The deploy branch holds generated files only; deploy.yml builds it from main.
    branches-ignore:
      - deploy
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:site
      - run: pnpm audit --prod --audit-level high
